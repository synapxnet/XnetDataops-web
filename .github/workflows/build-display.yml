name: Build DataOps web

on:
  push:
    branches:
      - display
      - main
  pull_request:
    branches:
      - display
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web application
        run: pnpm build:antd

      - name: Run unit and evidence tests
        run: pnpm test:unit

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: xnetdataops-web-dist
          path: apps/web-antd/dist
          if-no-files-found: error
          retention-days: 3
